name: CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type Check / Lint / Format / Unit Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Oxlint
        run: npx oxlint .

      - name: ESLint
        run: npx eslint . --cache

      - name: Prettier check
        run: npx prettier --check .

      - name: Unit test
        run: npm run test:unit

      - name: Build
        run: npm run build-only

  e2e:
    name: Playwright E2E
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      # checkジョブとは別のrunnerなので、distは引き継がれない。
      # PlaywrightのwebServerが vite preview を使用するため、
      # E2Eジョブ内でもproduction buildを生成する。
      - name: Build for E2E
        run: npm run build-only

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E test
        run: npm run test:e2e